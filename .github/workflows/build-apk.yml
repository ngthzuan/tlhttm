name: Build Android APK & Windows PC

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        run: npm install

      - name: Initialize Tauri Android Scaffolding
        run: npx tauri android init

      - name: Build Android APK (Unsigned Release)
        run: npx tauri android build --apk

      - name: Organize APK Files
        run: |
          mkdir -p output-apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -la output-apk/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tro-Ly-Hoc-Tap-Thong-Minh-Android-APK
          path: output-apk/*.apk
          retention-days: 30

  build-windows:
    name: Build Windows PC (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM dependencies
        run: npm install

      - name: Build Windows Installer (NSIS)
        run: npm run tauri build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tro-Ly-Hoc-Tap-Thong-Minh-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
